# Build the browser version of LightCraft (WebAssembly, with the phone/tablet support) and
# publish it on GitHub Pages: https://<user>.github.io/<repo>/
#
# One-time setup in the repository: Settings ▸ Pages ▸ Build and deployment ▸ Source:
# "GitHub Actions". Then every push to main (or "Run workflow" in the Actions tab) publishes it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The release browser build links the whole app into one module with fat LTO: give the
      # runner swap so it can't run out of memory.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - name: Rust toolchain (with the WebAssembly target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-web

      - name: wasm-bindgen version (from Cargo.lock)
        id: bindgen
        run: |
          v=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          echo "wasm-bindgen $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI (prebuilt)
        uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Install wasm-bindgen CLI (from source, if the prebuilt one is missing)
        run: |
          want="${{ steps.bindgen.outputs.version }}"
          have=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')
          if [ "$have" != "$want" ]; then
            cargo install wasm-bindgen-cli --version "$want" --locked --force
          fi
          wasm-bindgen --version

      - name: Build the web app
        run: cargo xtask web

      - name: Prepare the site
        run: |
          site=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/web-site
          mkdir -p _site
          cp -r "$site"/. _site/
          # GitHub Pages compresses on its own: the precompressed copies aren't needed
          find _site -name '*.gz' -delete
          find _site -name '*.br' -delete
          touch _site/.nojekyll
          ls -la _site _site/icons
          du -sh _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
